name: EOS Scorecard Sync

on:
  schedule:
    # Monday 7 AM ET (11 AM UTC, accounting for DST)
    - cron: '0 11 * * 1'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Salesforce sync
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: node sync-scorecard.js

      - name: Commit and push changes
        run: |
          git config user.name "R+ Bot"
          git config user.email "bot@redemptionplus.local"
          git add scorecard-data.json
          if ! git diff --cached --quiet; then
            git commit -m "⏰ Weekly scorecard sync — $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
